<!DOCTYPE html>
<!--
  Contact Distribution heatmap — reusable Notion /embed target.

  ONE page, many processes. The matrix STRUCTURE is fixed (the SGO company-type
  × role-profile taxonomy, defined in the ROLES / COMPANIES / PARTNERS blocks
  below); only the SCOPE — which contacts are counted — changes per process.

  Pick the scope with a query param on the embed URL:
      …/contact-matrix-heatmap.html?scope=bd-outreach
      …/contact-matrix-heatmap.html?scope=all-directory
      …/contact-matrix-heatmap.html?scope=event-dcd-ny-2026
  The page fetches  <BUCKET_BASE><scope>.json  and uses the feed's own `scope`
  field as the subtitle. Add a process = produce a new feed JSON + embed the
  same page with a new ?scope. No per-process code.

  IMPORTANT: this file intentionally has NO Jekyll front matter. Jekyll copies
  front-matter-less files verbatim, so the `{{ }}` / `{% %}` sequences in the JS
  below are NOT run through Liquid. Do not add a `---` block to the top.

  Self-contained by design: inline CSS + JS, zero external/CDN requests, so it
  loads reliably inside Notion's sandboxed iframe.

  The JSON feed is counts-only by construction (see the n8n workflow + the
  scoped GROUP BY). This page must NEVER render names or emails — only the
  aggregate cell counts it is given.

  Preview without a live feed: append ?demo=1 to the URL (or leave CONFIG.DEMO
  true). Flip CONFIG.DEMO to false once the feeds are live.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Distribution</title>
<style>
  /* ---- Brand palette (mirrors outreach-heatmap-from-supabase.py) ---- */
  :root {
    --true-black: #000000;
    --electric-yellow: #FF9D02;
    --chalk: #F2F2F2;
    --empty-fill: #F2F2F2;
    --empty-text: #A6A6A6;
    --partner-fill: #E6E6E6;
    --partner-text: #404040;
    --grid-line: #D9D9D9;
    --page-bg: #FFFFFF;
    --body-text: #000000;
    --muted-text: #737373;
    --header-bg: #000000;
    --header-text: #F2F2F2;
    --tier1-bg: #000000;
    --tier2-bg: #595959;
    --tier3-bg: #A6A6A6;
    --tier-text: #F2F2F2;
    --total-bg: #1A1A1A;
    --live-dot: #2ECC71;
    --error: #C0392B;
    /* ramp endpoints, also exposed to JS */
    --ramp-from: 242, 242, 242;   /* chalk  */
    --ramp-to: 255, 157, 2;       /* electric yellow */
    /* messaging-readiness marker: ink fill + opposite-value halo so it reads on
       any cell (pale chalk, saturated yellow, dark). NOT the yellow accent —
       yellow is the ramp max and would vanish on high-count cells. */
    --mk-ink: #000000;
    --mk-halo: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chalk: #1C1C1C;
      --empty-fill: #1C1C1C;
      --empty-text: #5A5A5A;
      --partner-fill: #2A2A2A;
      --partner-text: #B0B0B0;
      --grid-line: #333333;
      --page-bg: #0E0E0E;
      --body-text: #ECECEC;
      --muted-text: #8A8A8A;
      --header-bg: #000000;
      --header-text: #F2F2F2;
      --tier1-bg: #000000;
      --tier2-bg: #3A3A3A;
      --tier3-bg: #5A5A5A;
      --tier-text: #F2F2F2;
      --total-bg: #000000;
      --ramp-from: 28, 28, 28;    /* dark chalk */
      --ramp-to: 255, 157, 2;     /* electric yellow */
      --mk-ink: #F2F2F2;
      --mk-halo: #0E0E0E;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--body-text);
    font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 18px 18px 26px; max-width: 1200px; margin: 0 auto; }

  /* ---- Header ---- */
  .head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .pill {
    background: var(--electric-yellow); color: var(--true-black);
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  }
  .sub { color: var(--muted-text); font-size: 12px; margin: 6px 0 0; line-height: 1.5; }

  /* ---- Header right column (pill + refresh) ---- */
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .refresh-btn {
    appearance: none; cursor: pointer; font: inherit;
    border: 1px solid var(--grid-line); background: transparent;
    color: var(--body-text); font-size: 11px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .refresh-btn:hover:not(:disabled) { border-color: var(--electric-yellow); color: var(--electric-yellow); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-btn:focus-visible { outline: 2px solid var(--electric-yellow); outline-offset: 2px; }
  .refresh-btn .glyph { font-size: 13px; line-height: 1; }
  .mini-spin {
    width: 11px; height: 11px; border: 2px solid var(--grid-line);
    border-top-color: var(--electric-yellow); border-radius: 50%;
    display: inline-block; animation: spin 0.8s linear infinite;
  }
  .refresh-msg { font-size: 10.5px; color: var(--muted-text); max-width: 240px; text-align: right; line-height: 1.35; }
  .refresh-msg.err { color: var(--error); }

  /* ---- Filter tabs (BD / Events / Directory) ---- */
  .tabs {
    display: inline-flex; margin-top: 12px;
    border: 1px solid var(--grid-line); border-radius: 8px; overflow: hidden;
  }
  .tab {
    appearance: none; border: none; background: transparent;
    color: var(--muted-text); font: inherit; font-size: 12px; font-weight: 600;
    padding: 7px 18px; cursor: pointer; border-right: 1px solid var(--grid-line);
    transition: background 0.12s, color 0.12s;
  }
  .tab:last-child { border-right: none; }
  .tab:hover { color: var(--body-text); }
  .tab.active { background: var(--electric-yellow); color: var(--true-black); }
  .tab:focus-visible { outline: 2px solid var(--electric-yellow); outline-offset: -2px; }
  .scope-label { color: var(--body-text); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live-dot); display: inline-block;
  }
  .dot.stale { background: var(--muted-text); }
  .dot.err   { background: var(--error); }

  /* ---- Table ---- */
  .scroll {
    margin-top: 14px; overflow: auto; max-height: 78vh;
    border: 1px solid var(--grid-line); border-radius: 6px;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--grid-line);
           border-right: 1px solid var(--grid-line); white-space: nowrap; }
  th:last-child, td:last-child { border-right: none; }

  /* number cells: tabular alignment */
  td.num, th.num, td.total, th.tot-h {
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* ---- Messaging-readiness marker ----
     A small dot in a cell's bottom-left corner flags that an outreach message
     exists for that (company × role) segment: filled = approved, hollow = draft.
     It's a second, orthogonal signal on the count heatmap, so it uses the shape +
     position channels the ramp doesn't (ramp owns fill/color). Data: the
     hand-maintained READINESS map in the JS below. */
  td.num { position: relative; }
  .mk {
    position: absolute; left: 3px; bottom: 3px;
    width: 8px; height: 8px; border-radius: 50%;
    box-sizing: border-box; pointer-events: none;
    box-shadow: 0 0 0 1.5px var(--mk-halo);   /* halo carries it on any fill */
  }
  .mk-ready { background: var(--mk-ink); }                         /* approved */
  .mk-draft { background: var(--mk-halo); border: 1.5px solid var(--mk-ink); } /* draft */

  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--header-bg); color: var(--header-text);
    font-weight: 600; font-size: 11.5px; text-align: center;
    line-height: 1.25; vertical-align: middle;
  }
  /* sticky first two columns (tier + company) */
  .c-tier  { position: sticky; left: 0;    z-index: 2; width: 42px; text-align: center;
             font-weight: 600; color: var(--tier-text); }
  .c-comp  { position: sticky; left: 42px; z-index: 2; min-width: 200px; text-align: left;
             background: var(--page-bg); }
  thead .c-tier, thead .c-comp { z-index: 4; }
  thead .c-tier { background: var(--header-bg); }
  thead .c-comp { background: var(--header-bg); color: var(--header-text); text-align: left; }

  td.c-tier.t1 { background: var(--tier1-bg); }
  td.c-tier.t2 { background: var(--tier2-bg); }
  td.c-tier.t3 { background: var(--tier3-bg); }

  td.total { font-weight: 700; background: var(--total-bg); color: var(--header-text); }
  th.tot-h { background: var(--header-bg); color: var(--electric-yellow); }

  /* partner band */
  tr.band td {
    background: var(--tier2-bg); color: var(--chalk);
    font-weight: 600; font-size: 10.5px; letter-spacing: 0.03em; text-align: left;
  }
  tr.partner td { background: var(--partner-fill); color: var(--partner-text); font-style: italic; }
  tr.partner .c-comp { background: var(--partner-fill); }
  td.partner-span { text-align: center; }

  /* totals footer */
  tfoot td {
    position: sticky; bottom: 0; z-index: 2;
    background: var(--total-bg); color: var(--header-text);
    font-weight: 700; border-top: 2px solid var(--grid-line);
  }
  tfoot td.c-tier, tfoot td.c-comp { background: var(--total-bg); color: var(--header-text);
                                     text-align: left; font-style: normal; }

  /* ---- Legend ---- */
  .legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            margin-top: 14px; font-size: 11px; color: var(--muted-text); }
  .legend b { color: var(--body-text); font-weight: 600; margin-right: 4px; }
  .swatch { width: 30px; height: 18px; border: 1px solid var(--grid-line);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; color: var(--body-text);
            font-variant-numeric: tabular-nums; }
  /* readiness markers reused in the legend (position:static, not corner-pinned) */
  .legend .mk { position: static; }
  .lg-mk { display: inline-flex; align-items: center; gap: 7px; }

  /* ---- States ---- */
  .state { padding: 40px 12px; text-align: center; color: var(--muted-text); font-size: 13px; }
  .state.error { color: var(--error); }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 12px;
    border: 3px solid var(--grid-line); border-top-color: var(--electric-yellow);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .title { font-size: 16px; }
    table { font-size: 11px; }
    .c-comp { min-width: 150px; }
    .mk { width: 6px; height: 6px; left: 2px; bottom: 2px; box-shadow: 0 0 0 1px var(--mk-halo); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1 class="title" id="title">Contact Distribution</h1>
      <p class="sub">
        <span class="scope-label" id="scopeLabel"></span>
        <span class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></span>
      </p>
    </div>
    <div class="head-right">
      <div class="pill" id="pill">— CONTACTS</div>
      <button class="refresh-btn hidden" id="refreshBtn" type="button"
              title="Recompute all distributions from the live directory">
        <span class="glyph" id="refreshGlyph">↻</span><span id="refreshLabel">Refresh</span>
      </button>
      <div class="refresh-msg hidden" id="refreshMsg"></div>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="loading" class="state"><div class="spinner"></div>Loading distribution…</div>
  <div id="error" class="state error hidden"></div>

  <div class="scroll hidden" id="tableWrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

  <div class="legend hidden" id="legend"></div>
</div>

<script>
/* =========================================================================
   CONFIG — everything you'd normally tweak lives here.
   ========================================================================= */
const CONFIG = {
  // Default heading. The per-process detail comes from the feed's `scope`
  // field, shown as the subtitle, so this rarely needs to change.
  TITLE: "Contact Distribution",
  // Base path of the public Storage bucket the n8n nightly job writes to.
  // The page fetches  BUCKET_BASE + <slug> + ".json".
  BUCKET_BASE: "https://ajynejzgqmgufrbircad.supabase.co/storage/v1/object/public/public-dashboards/segment-matrix/",
  // n8n webhook that reruns the "Segment Matrix — Nightly Dashboard Feeds"
  // pipeline on demand (all three scopes). The Refresh button POSTs here, then
  // the page polls the active feed until its generatedAt advances. The workflow
  // is counts-only (no PII / no Apollo credits), and CORS is open on the webhook,
  // so exposing this URL on the public embed only lets someone recompute counts.
  REFRESH_WEBHOOK: "https://n8n.helios-server.synology.me/webhook/segment-matrix-refresh",
  // The filter tabs. Each maps an on-screen label to a feed slug (<slug>.json
  // in the bucket). Add a tab = add an entry here + produce that feed; order
  // here is the on-screen order. Same matrix structure, different scope.
  VIEWS: [
    { slug: "bd-outreach",   label: "BD" },
    { slug: "events",        label: "Events" },
    { slug: "all-directory", label: "Directory" },
  ],
  // Tab shown first when the embed URL has no ?scope= param.
  DEFAULT_VIEW: "bd-outreach",
  REFRESH_MS: 60 * 60 * 1000,   // re-fetch cadence (data only changes nightly)
  // DEMO: render the baked-in sample instead of fetching. Default false so the
  // live embed never shows fake numbers; append ?demo=1 to any URL to preview
  // (works on a local file:/// open too).
  DEMO: false,
};

/* =========================================================================
   TAXONOMY — fixed grid structure shared by every scope. The feed only carries
   {row, col, value}; this page owns ordering, tiers, and the partner band, so
   the grid is identical across every process.

   CANONICAL SIBLING: docs/brainstorm/assets/outreach-heatmap-from-supabase.py
   holds the same ROLES / COMPANIES / PARTNERS taxonomy and brand palette. The
   DB function (segment_matrix) deliberately does NOT hardcode the taxonomy, so
   these two renderers are the only copies — if you change a company type, role,
   tier, partner entry, or the ramp colors, update BOTH files in the same change.
   ========================================================================= */
const ROLES = [
  "Executive",
  "Engineering / Technical",
  "Procurement / Sourcing",
  "Project / Program Management",
  "Finance / Capital",
  "Operations",
  "BD / Sales",
];
// short, clean column headers (matches the "How the Contact Classifier Works" design)
const ROLE_LABELS = {
  "Executive": "Exec",
  "Engineering / Technical": "Eng",
  "Procurement / Sourcing": "Proc",
  "Project / Program Management": "PM",
  "Finance / Capital": "Fin",
  "Operations": "Ops",
  "BD / Sales": "BD",
};
const COMPANIES = [
  { tier: "T1", name: "Data Center Developer" },
  { tier: "T1", name: "Hyperscaler / Neocloud" },
  { tier: "T1", name: "Data Center Operator / Colo" },
  { tier: "T1", name: "Procurement Company" },
  { tier: "T1", name: "EPC" },
  { tier: "T2", name: "Utility" },
  { tier: "T2", name: "EAAS / PPA" },
  { tier: "T2", name: "GC" },
  { tier: "T2", name: "Electrical Contractor" },
  { tier: "T2", name: "Design and Engineering" },
  { tier: "T2", name: "Powered Land Developer" },
  { tier: "T2", name: "Land & Site Broker" },
  { tier: "T3", name: "Capital Partner" },
];
const PARTNERS = [
  { tier: "T3", name: "Equipment Manufacturer" },
  { tier: "T3", name: "Equipment Vendor" },
];

/* =========================================================================
   MESSAGING READINESS — INTERIM, HAND-MAINTAINED overlay.

   A second, orthogonal signal on the count heatmap: which (company-type × role)
   segments have an outreach message written, and at what stage. A cell shows a
   corner dot when a message exists for that segment —
       ● filled (mk-ready) = READY  — an approved-for-team-use template
       ○ hollow (mk-draft) = DRAFT  — a template exists but isn't approved yet
       (no dot)            = no template written for that cell
   Version / brand / template detail lives in the hover title, not the cell — a
   matrix answers "covered / not covered" at a glance; "which version" is a
   drill-down. Today every approved message is brand SGO, cold-intro step, v1.0.

   SOURCE OF TRUTH is Notion + internal/outreach/build_messaging.py (its APPROVED
   and DRAFT dicts). This map is a hand-copied snapshot, filtered to the company
   rows this grid actually renders (build_messaging.py's "Electrical Contractor"
   and "Land Developer" segments aren't rows here, so they're omitted). It is
   scope-independent: an approved message for a segment is the same on the BD,
   Events, and Directory tabs, so the markers render identically across scopes.

   MAINTENANCE: when a message is approved / drafted / retired, update this map by
   hand — exactly like the ROLES / COMPANIES taxonomy above is hand-maintained.
   When this set grows large or volatile, retire this map in favour of a per-cell
   readiness flag carried by the nightly feed (segment_matrix + the n8n job).

   Keys are "<company type>|<role>" using the EXACT row / column names above.
   ========================================================================= */
const READINESS = {
  // READY — approved cold-intro templates (SGO · v1.0)
  "Capital Partner|Finance / Capital":             { s: "ready", t: "Capital / Investor — Finance / Capital — First Email" },
  "Data Center Developer|Executive":               { s: "ready", t: "Data Center Developer — Executive — First Email" },
  "Data Center Developer|Engineering / Technical": { s: "ready", t: "Data Center Developer — Engineering — First Email" },
  "Data Center Developer|Procurement / Sourcing":  { s: "ready", t: "Data Center Developer — Procurement — First Email" },
  "EPC|Procurement / Sourcing":                    { s: "ready", t: "GC / EPC — Procurement — First Email" },
  "GC|Procurement / Sourcing":                     { s: "ready", t: "GC / EPC — Procurement — First Email" },
  "Procurement Company|Procurement / Sourcing":    { s: "ready", t: "Procurement Company — Procurement — First Email" },
  // DRAFT — a template exists in Notion but is not yet approved
  "EPC|Project / Program Management":              { s: "draft" },
  "GC|Project / Program Management":               { s: "draft" },
  "EPC|Executive":                                 { s: "draft" },
  "GC|Executive":                                  { s: "draft" },
  "Hyperscaler / Neocloud|Engineering / Technical": { s: "draft" },
  "Hyperscaler / Neocloud|Executive":              { s: "draft" },
  "Hyperscaler / Neocloud|Procurement / Sourcing": { s: "draft" },
  "Procurement Company|Executive":                 { s: "draft" },
  "Utility|Engineering / Technical":               { s: "draft" },
  "Utility|Executive":                             { s: "draft" },
};

// Marker HTML + hover title for a cell, or blanks when no message exists there.
function readinessMarker(company, role) {
  const r = READINESS[`${company}|${role}`];
  if (!r) return { html: "", title: "" };
  if (r.s === "ready")
    return {
      html: '<span class="mk mk-ready"></span>',
      title: "Approved outreach message · SGO · cold intro · v1.0"
             + (r.t ? " — " + r.t : ""),
    };
  return {
    html: '<span class="mk mk-draft"></span>',
    title: "Draft outreach message — template exists, not yet approved",
  };
}

/* Baked-in sample so the page renders before any feed exists. Illustrative
   counts only; replaced by the live feed when CONFIG.DEMO = false. */
const DEMO_FEED = {
  generatedAt: "2026-06-29T00:00:00Z",
  scope: "Sample data (no live feed yet)",
  data: [
    { row: "Design and Engineering", col: "BD / Sales", value: 6 },
    { row: "Design and Engineering", col: "Executive", value: 14 },
    { row: "Design and Engineering", col: "Engineering / Technical", value: 98 },
    { row: "Design and Engineering", col: "Operations", value: 4 },
    { row: "Design and Engineering", col: "Procurement / Sourcing", value: 6 },
    { row: "Design and Engineering", col: "Project / Program Management", value: 20 },
    { row: "EPC", col: "BD / Sales", value: 23 },
    { row: "EPC", col: "Executive", value: 35 },
    { row: "EPC", col: "Engineering / Technical", value: 273 },
    { row: "EPC", col: "Operations", value: 15 },
    { row: "EPC", col: "Procurement / Sourcing", value: 462 },
    { row: "EPC", col: "Project / Program Management", value: 109 },
    { row: "GC", col: "Executive", value: 1 },
    { row: "GC", col: "Engineering / Technical", value: 23 },
    { row: "GC", col: "Operations", value: 1 },
    { row: "GC", col: "Procurement / Sourcing", value: 16 },
    { row: "GC", col: "Project / Program Management", value: 16 },
  ],
};

/* ========================================================================= */

const $ = id => document.getElementById(id);
const PARAMS = new URLSearchParams(location.search);
const DEMO = CONFIG.DEMO || PARAMS.get("demo") === "1";
const VALID = new Set(CONFIG.VIEWS.map(v => v.slug));
const cleanSlug = s => (s || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
const labelFor = slug => (CONFIG.VIEWS.find(v => v.slug === slug) || {}).label || slug;
// feed slug is used to build a bucket path — only known tab slugs are allowed,
// so the fetch is locked to our bucket (no traversal / arbitrary URLs).
const dataUrlFor = slug => CONFIG.BUCKET_BASE + slug + ".json";
// initial tab: ?scope= / ?view= if it names a known tab, else the default.
let activeScope = (() => {
  const req = cleanSlug(PARAMS.get("scope") || PARAMS.get("view"));
  return VALID.has(req) ? req : CONFIG.DEFAULT_VIEW;
})();

let refreshTimer = null;
let agoTimer = null;
let lastGeneratedAt = null;
let lastFetchFailed = false;

// Read the CSS ramp endpoints once per render (they only change with the OS
// theme). Pass the parsed ramp into rampColor so it isn't recomputed per cell.
function readRamp() {
  const style = getComputedStyle(document.documentElement);
  return {
    from: style.getPropertyValue("--ramp-from").split(",").map(Number),
    to: style.getPropertyValue("--ramp-to").split(",").map(Number),
  };
}
function rampColor(n, max, ramp) {
  if (!n || n <= 0 || max <= 0) return "var(--empty-fill)";
  const t = Math.min(1, Math.sqrt(n / max));   // sqrt scaling, like the Python
  const rgb = ramp.from.map((c, i) => Math.round(c + t * (ramp.to[i] - c)));
  return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}

function fmtAgo(iso) {
  const then = new Date(iso).getTime();
  if (isNaN(then)) return "unknown time";
  const s = Math.max(0, Math.floor((Date.now() - then) / 1000));
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.floor(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}

function setStatus(kind, generatedAt) {
  const dot = $("dot"), txt = $("statusText");
  dot.className = "dot" + (kind === "error" ? " err" : kind === "stale" ? " stale" : "");
  if (kind === "error") { txt.textContent = "Failed to load — retrying"; return; }
  lastGeneratedAt = generatedAt;
  txt.textContent = `live · generated ${fmtAgo(generatedAt)}`;
}

function tickAgo() {
  // Don't repaint a currently-failing refresh as "live" — leave the error
  // indicator up until a fetch succeeds again.
  if (lastFetchFailed) return;
  if (lastGeneratedAt) {
    const stale = (Date.now() - new Date(lastGeneratedAt).getTime()) > 36 * 3600 * 1000;
    setStatus(stale ? "stale" : "live", lastGeneratedAt);
  }
}

function showState(which) {
  $("loading").classList.toggle("hidden", which !== "loading");
  $("error").classList.toggle("hidden", which !== "error");
  $("tableWrap").classList.toggle("hidden", which !== "table");
  $("legend").classList.toggle("hidden", which !== "table");
}

function render(feed) {
  // index counts by "row|col"
  const idx = new Map();
  for (const cell of (feed.data || [])) {
    if (typeof cell.value !== "number") continue;
    idx.set(`${cell.row}|${cell.col}`, cell.value);
  }
  const get = (row, col) => idx.get(`${row}|${col}`) || 0;

  // max over the customer grid only (partner band excluded), like the Python
  let max = 0, grandTotal = 0;
  for (const c of COMPANIES)
    for (const r of ROLES) { const v = get(c.name, r); if (v > max) max = v; }
  for (const v of idx.values()) grandTotal += v;
  max = max || 1;
  const ramp = readRamp();

  // ---- header ----
  let h = "<tr>";
  h += `<th class="c-tier">Tier</th><th class="c-comp">Company Type</th>`;
  for (const r of ROLES) h += `<th class="num">${ROLE_LABELS[r].replace(/\n/g, "<br>")}</th>`;
  h += `<th class="tot-h">Total</th></tr>`;
  $("thead").innerHTML = h;

  // ---- body ----
  const colTotals = ROLES.map(() => 0);
  let rows = "";
  for (const c of COMPANIES) {
    let rowTotal = 0, cells = "";
    ROLES.forEach((r, i) => {
      const v = get(c.name, r);
      rowTotal += v; colTotals[i] += v;
      const bg = rampColor(v, max, ramp);
      const fg = v > 0 ? "var(--body-text)" : "var(--empty-text)";
      // Messaging-readiness marker renders regardless of count: a segment can
      // have an approved message with zero sourced contacts yet, and vice versa —
      // that count-vs-message crossing is exactly what this overlay surfaces.
      const mk = readinessMarker(c.name, r);
      cells += `<td class="num"${mk.title ? ` title="${mk.title}"` : ""} style="background:${bg};color:${fg};${v > 0 ? "font-weight:600;" : ""}">${v > 0 ? v : "–"}${mk.html}</td>`;
    });
    rows += `<tr>`
      + `<td class="c-tier ${c.tier.toLowerCase()}">${c.tier}</td>`
      + `<td class="c-comp">${c.name}</td>`
      + cells
      + `<td class="total">${rowTotal || "–"}</td>`
      + `</tr>`;
  }

  // partner band
  let partnerTotal = 0;
  const colspan = ROLES.length + 1; // role cols + total col
  rows += `<tr class="band"><td class="c-tier t3">&nbsp;</td>`
    + `<td class="c-comp" style="background:var(--tier2-bg);color:var(--chalk);">PARTNER TRACK</td>`
    + `<td colspan="${colspan}">out of scope for this matrix — row total shown instead of per-role split</td></tr>`;
  for (const p of PARTNERS) {
    let pt = 0;
    for (const r of ROLES) pt += get(p.name, r);
    pt += get(p.name, "Partner Track");   // partner contacts may carry this role bucket
    partnerTotal += pt;
    rows += `<tr class="partner"><td class="c-tier t3">${p.tier}</td>`
      + `<td class="c-comp">${p.name}</td>`
      + `<td class="partner-span" colspan="${colspan}">${pt} contacts — Partner Track</td></tr>`;
  }
  $("tbody").innerHTML = rows;

  // ---- footer (column totals) ----
  let f = `<tr><td class="c-tier">&nbsp;</td><td class="c-comp">Column total</td>`;
  for (const t of colTotals) f += `<td class="total">${t || "–"}</td>`;
  const customerTotal = colTotals.reduce((a, b) => a + b, 0);
  f += `<td class="total">${customerTotal}</td></tr>`;
  $("tfoot").innerHTML = f;

  // ---- legend ----
  const samples = [0, 1, Math.max(1, Math.round(max / 8)), Math.max(1, Math.round(max / 4)),
                   Math.max(1, Math.round(max / 2)), max];
  const seen = new Set();
  let leg = `<b>Contacts</b>`;
  for (const n of samples) {
    if (seen.has(n)) continue; seen.add(n);
    const bg = n > 0 ? rampColor(n, max, ramp) : "var(--empty-fill)";
    leg += `<span class="swatch" style="background:${bg}">${n > 0 ? n : "–"}</span>`;
  }
  leg += `<span style="margin-left:6px">sqrt scale · grid max ${max}</span>`;
  if (partnerTotal) leg += `<span style="margin-left:10px">Partner Track: ${partnerTotal} (excluded from ramp)</span>`;
  // Cells whose row/column fall outside the fixed taxonomy (e.g. null company
  // type or role) aren't placed in the grid — surface the count so the pill
  // total reconciles, mirroring the Python "omitted from grid" note.
  const omitted = grandTotal - customerTotal - partnerTotal;
  if (omitted > 0) leg += `<span style="margin-left:10px">${omitted.toLocaleString()} with no company/role classification (omitted from grid)</span>`;
  // readiness marker key (corner dots) — a distinct dimension from the count ramp
  leg += `<span style="margin-left:14px"><b>Messaging</b></span>`
       + `<span class="lg-mk"><span class="mk mk-ready"></span>approved</span>`
       + `<span class="lg-mk"><span class="mk mk-draft"></span>draft</span>`;
  $("legend").innerHTML = leg;

  // ---- chrome ----
  $("scopeLabel").textContent = feed.scope ? feed.scope + " · " : "";
  $("pill").textContent = `${grandTotal.toLocaleString()} CONTACTS`;
  setStatus("live", feed.generatedAt);
  showState("table");
}

async function load() {
  try {
    const scope = activeScope;            // capture: tab may change mid-fetch
    let feed;
    if (DEMO) {
      feed = { ...DEMO_FEED, scope: labelFor(scope) + " — sample" };
    } else {
      const res = await fetch(dataUrlFor(scope), { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      feed = await res.json();
    }
    if (scope !== activeScope) return;    // a newer tab click superseded this
    if (!feed || !Array.isArray(feed.data)) throw new Error("malformed feed");
    render(feed);
    lastFetchFailed = false;
  } catch (e) {
    lastFetchFailed = true;
    setStatus("error");
    $("error").textContent = `Could not load the "${labelFor(activeScope)}" distribution (${e.message}). Retrying on the next refresh.`;
    // keep a prior good render on screen if we have one; only show the error
    // state when nothing has rendered yet.
    if ($("tableWrap").classList.contains("hidden")) showState("error");
  }
}

/* =========================================================================
   ON-DEMAND REFRESH — POST the n8n webhook, then poll the watched scope's feed
   until its server-stamped generatedAt advances. The webhook reruns the exact
   nightly pipeline for all three scopes and responds immediately, so the work
   happens in the background while we poll for the result.
   ========================================================================= */
let refreshing = false;

function setRefreshBusy(busy) {
  $("refreshBtn").disabled = busy;
  $("refreshGlyph").outerHTML = busy
    ? '<span class="mini-spin" id="refreshGlyph"></span>'
    : '<span class="glyph" id="refreshGlyph">↻</span>';
  $("refreshLabel").textContent = busy ? "Refreshing…" : "Refresh";
}

function refreshNote(msg, isErr) {
  const m = $("refreshMsg");
  if (!msg) { m.classList.add("hidden"); m.textContent = ""; m.classList.remove("err"); return; }
  m.textContent = msg;
  m.classList.toggle("err", !!isErr);
  m.classList.remove("hidden");
}

async function triggerRefresh() {
  if (refreshing || DEMO || !CONFIG.REFRESH_WEBHOOK) return;
  refreshing = true;
  setRefreshBusy(true);
  refreshNote("Recomputing all distributions…", false);

  const scope = activeScope;          // the tab we'll watch for the update
  const baseline = lastGeneratedAt;   // server-stamped time of the feed on screen

  try {
    const res = await fetch(CONFIG.REFRESH_WEBHOOK, { method: "POST", mode: "cors" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (e) {
    setRefreshBusy(false);
    refreshing = false;
    refreshNote(`Couldn't start the refresh (${e.message}).`, true);
    return;
  }

  const started = Date.now();
  const POLL_MS = 3000, TIMEOUT_MS = 90 * 1000;
  const poll = async () => {
    if (Date.now() - started > TIMEOUT_MS) {
      setRefreshBusy(false);
      refreshing = false;
      refreshNote("Still running — the new numbers will appear automatically once ready.", false);
      return;
    }
    try {
      const res = await fetch(dataUrlFor(scope), { cache: "no-store" });
      if (res.ok) {
        const feed = await res.json();
        const advanced = feed && Array.isArray(feed.data) &&
          (!baseline || new Date(feed.generatedAt).getTime() > new Date(baseline).getTime());
        if (advanced) {
          // Only repaint if the watched tab is still the one on screen; either
          // way the refresh is done (every scope was recomputed by the webhook).
          if (scope === activeScope) { render(feed); lastFetchFailed = false; }
          setRefreshBusy(false);
          refreshing = false;
          refreshNote("Updated just now.", false);
          setTimeout(() => refreshNote(""), 4000);
          return;
        }
      }
    } catch { /* transient fetch error — keep polling */ }
    setTimeout(poll, POLL_MS);
  };
  setTimeout(poll, POLL_MS);
}

function renderTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  for (const v of CONFIG.VIEWS) {
    const b = document.createElement("button");
    b.className = "tab" + (v.slug === activeScope ? " active" : "");
    b.textContent = v.label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", v.slug === activeScope ? "true" : "false");
    b.addEventListener("click", () => switchView(v.slug));
    box.appendChild(b);
  }
}

function switchView(slug) {
  if (slug === activeScope || !VALID.has(slug)) return;
  activeScope = slug;
  renderTabs();
  showState("loading");
  load();
}

function start() {
  $("title").textContent = PARAMS.get("title") || CONFIG.TITLE;
  renderTabs();
  // The Refresh button only makes sense against a live pipeline — hide it in
  // demo mode (no real feeds to recompute).
  if (!DEMO && CONFIG.REFRESH_WEBHOOK) {
    const btn = $("refreshBtn");
    btn.classList.remove("hidden");
    btn.addEventListener("click", triggerRefresh);
  }
  showState("loading");
  load();
  refreshTimer = setInterval(load, CONFIG.REFRESH_MS);
  agoTimer = setInterval(tickAgo, 60 * 1000);
}
start();
</script>
</body>
