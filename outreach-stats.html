<!DOCTYPE html>
<!--
  Outreach Command Center — Notion /embed target (ADR-0053). Compact build:
  one stat strip + the message table, sized to fit a Notion embed height.

  Self-contained: inline CSS + JS, zero external/CDN requests. NO Jekyll front
  matter (Liquid would eat the ${} in the JS).

  COUNTS ONLY — never a contact name or email (mirrors to the public
  volta-dashboards repo). Live: fetches feed.json (written each sync by
  outreach-stats-sync-v1) from the public bucket. Verdict logic lives in verdict().
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outreach Command Center</title>
<style>
  :root {
    --electric-yellow:#FF9D02;
    --page-bg:#FFFFFF; --surface:#F7F7F6; --card:#FFFFFF;
    --body-text:#0A0A0A; --muted-text:#6B6B6B; --faint-text:#9A9A9A;
    --grid-line:#E7E7E4; --header-bg:#000; --header-text:#F2F2F2; --bar-track:#EFEEEB;
    --good:#177245; --good-bg:#E7F3EC; --warn:#B23A16; --warn-bg:#FBEAE3;
    --neutral:#6B6B6B; --neutral-bg:#EFEEEB; --live-dot:#2ECC71;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg:#0C0C0C; --surface:#151513; --card:#171716;
      --body-text:#ECECEC; --muted-text:#9A9A97; --faint-text:#5E5E5A;
      --grid-line:#2A2A27; --bar-track:#26251F;
      --good:#5CC98A; --good-bg:#12291D; --warn:#F0895E; --warn-bg:#2E1811;
      --neutral:#9A9A97; --neutral-bg:#232320;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--page-bg); color:var(--body-text);
    font-family:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; }
  .wrap { padding:14px 16px 16px; max-width:1040px; margin:0 auto; }

  /* Header + tabs (one compact row) */
  .head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .head-l { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .title { font-size:18.5px; font-weight:600; letter-spacing:-0.01em; margin:0; }
  .scope { color:var(--muted-text); font-size:13px; }
  .scope b { color:var(--body-text); font-weight:600; }
  .tabs { display:flex; gap:3px; background:var(--surface); border:1px solid var(--grid-line); border-radius:8px; padding:3px; }
  .tab { appearance:none; border:0; background:transparent; color:var(--muted-text); font:inherit; font-size:14px; font-weight:600;
    padding:4px 11px; border-radius:6px; cursor:pointer; }
  .tab[aria-selected="true"] { background:#000; color:var(--header-text); }
  .tab:focus-visible { outline:2px solid var(--electric-yellow); outline-offset:2px; }
  @media (prefers-color-scheme: dark){ .tab[aria-selected="true"]{ background:#2C2C28; } }

  /* Stat strip */
  .strip { display:flex; flex-wrap:wrap; border:1px solid var(--grid-line); border-radius:10px; background:var(--card);
    margin-top:12px; overflow:hidden; }
  .stat { flex:1 1 0; min-width:104px; padding:9px 14px; border-left:1px solid var(--grid-line); }
  .stat:first-child { border-left:0; }
  .stat .k { font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted-text); }
  .stat .v { font-size:24px; font-weight:700; letter-spacing:-0.02em; margin-top:3px; line-height:1; }
  .stat .v .r { font-size:14px; font-weight:600; color:var(--muted-text); margin-left:5px; }
  .stat.hi .v { color:var(--electric-yellow); }

  /* Sequence step funnel */
  .drop { font-size:11.5px; font-weight:600; color:var(--faint-text); margin-left:5px; }
  .seqsum { display:flex; flex-wrap:wrap; gap:20px; margin:9px 2px 0; font-size:13px; color:var(--muted-text); align-items:baseline; }
  .seqsum b { color:var(--body-text); font-weight:700; font-size:16px; margin-right:3px; }
  .seqsum .dim { color:var(--faint-text); }

  /* Table */
  .lbl { font-size:12px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--faint-text); margin:16px 2px 7px; }
  .card-table { border:1px solid var(--grid-line); border-radius:10px; overflow:hidden; }
  .table-scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14.5px; }
  thead th { background:var(--header-bg); color:var(--header-text); text-align:left; font-weight:600; font-size:11.5px;
    letter-spacing:0.04em; text-transform:uppercase; padding:7px 12px; white-space:nowrap; }
  thead th.num { text-align:right; }
  tbody td { padding:8px 12px; border-top:1px solid var(--grid-line); vertical-align:middle; }
  tbody td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .msg-seg { font-weight:600; }
  .msg-key { font-size:12px; color:var(--faint-text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:1px; }
  .rate-cell { min-width:132px; }
  .rate-wrap { display:flex; align-items:center; gap:8px; }
  .rate-num { font-variant-numeric:tabular-nums; font-weight:600; width:34px; text-align:right; }
  .bar-track { flex:1; height:7px; background:var(--bar-track); border-radius:999px; overflow:hidden; min-width:48px; }
  .bar-fill { height:100%; border-radius:999px; background:var(--electric-yellow); }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .chip .cdot { width:6px; height:6px; border-radius:50%; }
  .v-scale{color:var(--good);background:var(--good-bg);} .v-scale .cdot{background:var(--good);}
  .v-revise{color:var(--warn);background:var(--warn-bg);} .v-revise .cdot{background:var(--warn);}
  .v-work,.v-gather{color:var(--neutral);background:var(--neutral-bg);} .v-work .cdot,.v-gather .cdot{background:var(--neutral);}
  tr.gather td{ opacity:0.6; }
  .divider-row td{ padding:5px 12px; background:var(--surface); border-top:1px solid var(--grid-line);
    font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--faint-text); }

  .takeaway { font-size:13px; color:var(--muted-text); line-height:1.45; margin:10px 2px 0; }
  .takeaway b { color:var(--body-text); }
  .foot { color:var(--faint-text); font-size:12px; line-height:1.45; margin-top:10px; }
  .empty { text-align:center; padding:40px 16px; color:var(--muted-text); }
  .empty .big { font-size:16px; font-weight:600; color:var(--body-text); margin-bottom:5px; }
  @media (max-width:640px){ .stat{ flex-basis:33%; } }
</style>
</head>
<body data-palette="#FF9D02">
<div class="wrap">
  <div class="head">
    <div class="head-l">
      <h1 class="title">Outreach Command Center</h1>
      <span class="scope" id="scope"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="Brand">
      <button class="tab" role="tab" data-brand="SGO" aria-selected="true">SGO</button>
      <button class="tab" role="tab" data-brand="CEEG" aria-selected="false">CEEG</button>
      <button class="tab" role="tab" data-brand="Ankura" aria-selected="false">Ankura</button>
    </div>
  </div>
  <div id="panel"></div>
</div>

<script>
// Live feed — written each sync by outreach-stats-sync-v1 to the public bucket
// (counts only). The page fetches it at load, so numbers refresh without a
// rebuild (mirrors the Segment Matrix dashboard). init() at the bottom loads it.
const FEED_URL = "https://ajynejzgqmgufrbircad.supabase.co/storage/v1/object/public/public-dashboards/outreach-stats/feed.json";
let DATA = { SGO:null, CEEG:null, Ankura:null, generated_at:null };
const MIN_N = 10;
function verdict(opened, delivered){
  if (delivered < MIN_N) return { label:"Gathering", cls:"v-gather" };
  const r = opened/delivered;
  if (r >= 0.25) return { label:"Scale",   cls:"v-scale"  };
  if (r >= 0.12) return { label:"Working", cls:"v-work"   };
  return { label:"Revise", cls:"v-revise" };
}
const pct = (n,d) => d ? Math.round(n/d*100) : 0;

function stat(k,v,rate,hi){ return `<div class="stat ${hi?'hi':''}"><div class="k">${k}</div>`
  + `<div class="v">${v}${rate!=null?`<span class="r">${rate}</span>`:''}</div></div>`; }

function funnel(d){
  const drop = (n,base) => (n!=null && base) ? `<span class="drop">${Math.round(n/base*100)}%</span>` : "";
  const row = s => s.status === "paused"
    ? `<tr class="gather"><td>${s.name}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>`
      + `<td><span class="chip v-gather"><span class="cdot"></span>Paused</span></td></tr>`
    : `<tr><td>${s.name}</td><td class="num">${s.sent}</td>`
      + `<td class="num">${s.opened}${drop(s.opened,s.sent)}</td>`
      + `<td class="num">${s.clicked}${drop(s.clicked,s.sent)}</td><td></td></tr>`;
  const o = d.outcomes;
  return `<div class="lbl">Sequence · opens &amp; clicks as % of delivered, per step</div>
    <div class="card-table"><div class="table-scroll"><table>
      <thead><tr><th>Step</th><th class="num">Sent</th><th class="num">Opened</th><th class="num">Clicked</th><th></th></tr></thead>
      <tbody>${d.sequence.map(row).join("")}</tbody>
    </table></div></div>
    <div class="seqsum">
      <span><b>${o.replied}</b>replied <span class="dim">· at any step</span></span>
      <span><b>${o.completed}</b>completed the full sequence</span>
      <span><b>${o.in_progress}</b>in progress <span class="dim">· paused before FU1</span></span>
    </div>`;
}

// Data-driven "next move" — best message to scale + weakest high-volume one to
// revise, from the ready (>= MIN_N delivered) messages only. No baked numbers.
function takeaway(d){
  const ready = d.messages.filter(m=>m.delivered>=MIN_N).map(m=>({...m, r:m.opened/m.delivered}));
  if(!ready.length) return `<b>Next:</b> still gathering — no message has ${MIN_N}+ delivered yet.`;
  ready.sort((a,b)=>b.r-a.r);
  const best=ready[0], worst=ready[ready.length-1], parts=[];
  if(best.r>=0.25) parts.push(`scale <b>${best.seg}</b> (${pct(best.opened,best.delivered)}% open)`);
  if(worst.r<0.12 && worst.key!==best.key) parts.push(`revise <b>${worst.seg}</b> — most volume among the laggards (${worst.sent} sent), lowest open (${pct(worst.opened,worst.delivered)}%)`);
  if(!parts.length) parts.push(`hold — every message is in the working band; keep sending to build sample`);
  return `<b>Next:</b> ${parts.join("; ")}.`;
}
function renderSGO(d){
  const t=d.top, oR=pct(t.opened,t.delivered), cR=pct(t.clicked,t.delivered);
  const upd = DATA.generated_at ? new Date(DATA.generated_at).toISOString().slice(0,10) : "";
  document.getElementById("scope").innerHTML =
    `<b>${d.scope.contacts}</b> contacts · <b>${d.scope.cells}</b> messages${upd?` · updated ${upd}`:""}`;
  const rows = d.messages.map(m=>({...m, or:m.opened/m.delivered, ready:m.delivered>=MIN_N}));
  const ready = rows.filter(r=>r.ready).sort((a,b)=>b.or-a.or);
  const early = rows.filter(r=>!r.ready).sort((a,b)=>b.or-a.or);
  const row = (m,g) => { const vd=verdict(m.opened,m.delivered), o=pct(m.opened,m.delivered);
    return `<tr class="${g?'gather':''}"><td><div class="msg-seg">${m.seg}</div><div class="msg-key">${m.key} · v${m.v}</div></td>`
      + `<td class="num">${m.sent}</td><td class="num">${m.delivered}</td>`
      + `<td class="rate-cell"><div class="rate-wrap"><span class="rate-num">${o}%</span>`
      + `<span class="bar-track"><span class="bar-fill" style="width:${o}%"></span></span></div></td>`
      + `<td class="num">${m.opened}</td><td class="num">${m.clicked}</td>`
      + `<td><span class="chip ${vd.cls}"><span class="cdot"></span>${vd.label}</span></td></tr>`; };
  return `
    <div class="strip">
      ${stat("Delivered", t.delivered)}
      ${stat("Opened", t.opened, oR+"%", true)}
      ${stat("Clicked", t.clicked, cR+"%", true)}
      ${stat("Replied", t.replied)}
      ${stat("Bounced", t.bounced)}
      ${stat("Spam", t.spam, Math.round(t.spam_rate*100)+"%")}
    </div>
    ${funnel(d)}
    <div class="lbl">By message · cold email — ranked by open rate</div>
    <div class="card-table"><div class="table-scroll"><table>
      <thead><tr><th>Message</th><th class="num">Sent</th><th class="num">Deliv.</th>
        <th style="width:150px">Open rate</th><th class="num">Op.</th><th class="num">Cl.</th><th>Next move</th></tr></thead>
      <tbody>
        ${ready.map(m=>row(m,false)).join("")}
        ${early.length?`<tr class="divider-row"><td colspan="7">Too early — under ${MIN_N} delivered · follow-ups (FU1/FU2) not sent yet</td></tr>`:""}
        ${early.map(m=>row(m,true)).join("")}
      </tbody>
    </table></div></div>
    <div class="takeaway">${takeaway(d)}</div>
    <div class="foot">All rates are filtered (bot-screened) events ÷ delivered. Opens are undercounted by inbox privacy
      protection, so clicks &amp; replies are the more trustworthy signal. Verdicts (on open rate): Scale ≥25% · Working
      12–25% · Revise &lt;12% · Gathering &lt;10 sent. Counts only. Synced daily from Apollo.</div>`;
}
function renderEmpty(brand){
  document.getElementById("scope").innerHTML = "";
  return `<div class="card-table"><div class="empty"><div class="big">${brand} isn't sending yet</div>
    <div>Runs on its own Apollo sequence — appears here when it goes live (Phase B), same view.</div></div></div>`;
}
function select(brand){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.brand===brand)));
  const d=DATA[brand];
  document.getElementById("panel").innerHTML = d ? renderSGO(d) : renderEmpty(brand);
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>select(t.dataset.brand)));
(async function init(){
  document.getElementById("panel").innerHTML =
    `<div class="card-table"><div class="empty"><div class="big">Loading…</div></div></div>`;
  try {
    const res = await fetch(FEED_URL, { cache:"no-store" });
    if (!res.ok) throw new Error("HTTP "+res.status);
    DATA = await res.json();
  } catch (e) {
    document.getElementById("panel").innerHTML =
      `<div class="card-table"><div class="empty"><div class="big">Couldn't load stats</div>`
      + `<div>The feed didn't respond — it refreshes each sync; try a reload.</div></div></div>`;
    return;
  }
  select("SGO");
})();
</script>
</body>
</html>
